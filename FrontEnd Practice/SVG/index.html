<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

  <svg viewBox="0 0 300 150">
    <rect x="10" y="10" width="280" height="130" fill="black" rx="5" ry="5" />
  </svg>

  <svg >
    <polyline points="10,50 30,20 70,20 90,50" fill="none" stroke="black" />
  </svg>

  <svg viewBox="0 0 100 100">
    <polygon points="50,10 90,90 10,90" fill="black" />
  </svg>

  <svg class="icon" viewBox="0 0 100 100" width="200" height="200">
  <path d="M 20 20 L 20 80 L 80 50 Z" fill="black" />
  </svg>

  <svg class="draw-animation" viewBox="0 0 200 80">
    <path 
      d="M 20 50 L 40 70 L 80 30 Z" 
      pathLength="500" 
    />
  </svg>

  <svg viewBox="0 0 100 100">
  <defs>
    <linearGradient id="myGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="10%" stop-color="#FF512F" />   <stop offset="50%" stop-color="#DD2476" /> </linearGradient>
  </defs>

  <rect x="10" y="10" width="80" height="80" fill="url(#myGradient)" rx="10" />
  </svg>

  <svg viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="10%" stop-color="white" />
      <stop offset="80%" stop-color="blue" />
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="40" fill="url(#glow)" />
  </svg>

  <svg viewBox="0 0 200 100">
  <text x="10" y="30" font-family="sans-serif" font-size="10" >
    <tspan x="10" dy="0">This is line one.</tspan>
    <tspan x="10" dy="12">This is line two.</tspan>
    <tspan x="10" dy="12">This is <tspan fill="red" font-weight="bold">important</tspan>.</tspan>
  </text>
  </svg>

  <svg viewBox="0 0 200 100">
  <g transform="translate(50, 50)">
    <g transform="rotate(45)">
      <rect x="-10" y="-10" width="20" height="20" />
    </g>
  </g>
  </svg>

  <svg viewBox="0 0 100 100">
  <defs>
    <clipPath id="myCircleClip">
      <circle cx="50" cy="50" r="40" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="purple" clip-path="url(#myCircleClip)" />
  </svg>

  <svg viewBox="0 0 200 100">
  <defs>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="black" /> <stop offset="100%" stop-color="white" /> </linearGradient>

    <mask id="myFadeMask">
      <rect x="0" y="0" width="100" height="100" fill="url(#fade)" />
    </mask>
  </defs>

  <rect x="0" y="0" width="100" height="100" fill="blue" mask="url(#myFadeMask)" />
  </svg>

  <svg viewBox="0 0 100 100">
  <defs>
    <filter id="myBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" />
    </filter>
  </defs>

  <circle cx="50" cy="50" r="30" fill="red" filter="url(#myBlur)" />
  </svg>

  <svg viewBox="0 0 100 100">
  <defs>
    <filter id="myShadow">
      <feDropShadow dx="5" dy="5" stdDeviation="5" flood-color="black" flood-opacity="0.5" />
    </filter>
  </defs>

  <polygon points="50,10 90,90 10,90" fill="orange" filter="url(#myShadow)" />
  </svg>

  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="blobClip">
      <path d="M 40 20 C 80 -10, 150 20, 180 80 C 200 150, 120 190, 60 180 C 10 160, -20 80, 40 20 Z" />
    </clipPath>
  </defs>

  <image href="profile-photo.jpg" width="200" height="200" clip-path="url(#blobClip)" />
</svg>
</body>
</html>
